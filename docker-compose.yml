services:
  web:
    build: .
    restart: unless-stopped
    # Bez "ports" - Dokploy (Traefik) kieruje ruch na port 80 kontenera przez własną sieć
    expose:
      - "80"
    environment:
      SITE_URL: ${SITE_URL:-https://legacyevents.pl}
      SMTP_HOST: ${SMTP_HOST:-r1.idhosting.pl}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:?Ustaw SMTP_USER w Dokploy}
      SMTP_PASS: ${SMTP_PASS:?Ustaw SMTP_PASS w Dokploy}
      MAIL_FROM: ${MAIL_FROM:-zapytanie@legacyevents.pl}
      MAIL_TO: ${MAIL_TO:-kontakt@legacyevents.pl,banasiak@nexo-it.pl}
    volumes:
      - image-cache:/var/www/html/cache
      # Dane panelu admina: SEO, blog, galeria, najbliższe wydarzenie, hasło admina
      - data:/var/www/html/data
      - blog-images:/var/www/html/assets/blog
      # Galerie wydarzeń zarządzane z panelu (przy pierwszym starcie wypełniane zdjęciami z obrazu)
      - gallery:/var/www/html/assets/Events

volumes:
  image-cache:
  data:
  blog-images:
  gallery:
