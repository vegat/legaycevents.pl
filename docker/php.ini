expose_php = Off
display_errors = Off
log_errors = On
error_log = /dev/stderr
; image.php skaluje duże zdjęcia (do 6250x6250) przez GD
memory_limit = 512M
max_execution_time = 60
date.timezone = Europe/Warsaw
default_charset = "UTF-8"

; Panel admina - wgrywanie wielu zdjęć do galerii i bloga (odpowiednik .user.ini, którego mod_php nie czyta)
upload_max_filesize = 1024M
post_max_size = 1024M
max_file_uploads = 200
max_input_vars = 5000
max_input_time = 600
